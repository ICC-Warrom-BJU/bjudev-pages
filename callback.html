<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OAuth Callback</title>
<style>
  :root { --ink:#111827; --muted:#6b7280; --line:#e5e7eb; --accent:#0F6E56; }
  body { font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
         max-width:600px; margin:0 auto; padding:64px 24px; color:var(--ink); line-height:1.6; }
  h1 { font-size:1.3rem; letter-spacing:-0.02em; }
  code { display:block; background:#f9fafb; border:1px solid var(--line); border-radius:8px;
         padding:16px; margin:16px 0; word-break:break-all; font-family:'JetBrains Mono',monospace;
         font-size:0.8rem; }
  button { background:var(--accent); color:#fff; border:0; border-radius:8px;
           padding:10px 18px; font-size:0.9rem; cursor:pointer; }
  .muted { color:var(--muted); font-size:0.875rem; }
  .err { color:#b91c1c; }
</style>
</head>
<body>
<h1>OAuth Callback</h1>
<div id="out"></div>
<script>
  var p = new URLSearchParams(window.location.search);
  var code = p.get('code');
  var err  = p.get('error_description') || p.get('error');
  var out  = document.getElementById('out');
  function clean(s){ return s.replace(/[<>&"]/g, ''); }

  if (code) {
    out.innerHTML =
      '<p>Salin kode di bawah, lalu jalankan script autentikasi di terminal Anda.</p>' +
      '<code>' + clean(code) + '</code>' +
      '<button id="b">Salin kode</button>' +
      '<p class="muted">Kode ini berumur pendek. Segera tukarkan menjadi token.</p>';
    document.getElementById('b').onclick = function () {
      navigator.clipboard.writeText(code);
      this.textContent = 'Tersalin';
    };
  } else if (err) {
    out.innerHTML = '<p class="err">Otorisasi gagal: ' + clean(err) + '</p>';
  } else {
    out.innerHTML = '<p class="muted">Tidak ada kode otorisasi. Halaman ini hanya menerima redirect OAuth.</p>';
  }
</script>
</body>
</html>
